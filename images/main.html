<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Прием изображения</title>
</head>
<body style="margin:0; background:#000; display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <script>
        // Получаем данные из POST запроса
        // Для этого нужно, чтобы сервер передал base64 в переменную
        // Вариант 1: сервер вставляет base64 прямо в JS
        
        // Эту переменную сервер должен заполнить из POST данных
        const imageBase64 = "{{BASE64_FROM_POST}}"; // Заменяется сервером
        
        if (imageBase64 && imageBase64 !== "{{BASE64_FROM_POST}}") {
            const img = new Image();
            img.src = `data:image/png;base64,${imageBase64}`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100vh';
            img.style.objectFit = 'contain';
            document.body.appendChild(img);
        } else {
            document.body.innerHTML = '<div style="color:red">Ошибка: нет изображения</div>';
        }
    </script>
</body>
</html>
