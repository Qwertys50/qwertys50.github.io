        let currentModuleIndex = 0;

        function updateSlider() {
            const module = info.modules[currentModuleIndex];
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const messageTextEl = document.getElementById('messageText');
            const messageTimeEl = document.getElementById('messageTime');
            const fileAttachmentEl = document.getElementById('fileAttachment');
            
            if (module.fileName) {
                fileNameEl.textContent = module.fileName;
                fileAttachmentEl.classList.remove('hidden');
            } else {
                fileAttachmentEl.classList.add('hidden');
            }
            
            if (module.size) {
                fileSizeEl.textContent = module.size;
            } else {
                fileSizeEl.textContent = '';
            }
            
            if (module.text && module.text.length > 0) {
                messageTextEl.innerHTML = module.text.join('');
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = messageTextEl.innerHTML;
                tempDiv.style.cssText = 'position: absolute; visibility: hidden; width: 100%;';
                document.body.appendChild(tempDiv);
                
                const oldReadMore = document.querySelector('.read-more');
                if (oldReadMore) {
                    oldReadMore.remove();
                }
                
                if (tempDiv.scrollHeight > 120) {
                    messageTextEl.classList.add('collapsed');
                    
                    const readMoreBtn = document.createElement('div');
                    readMoreBtn.className = 'read-more';
                    readMoreBtn.textContent = 'Больше...';
                    readMoreBtn.onclick = function() {
                        messageTextEl.classList.toggle('collapsed');
                        this.textContent = messageTextEl.classList.contains('collapsed') ? 'Больше...' : 'Скрыть';
                    };
                    
                    messageTextEl.parentNode.appendChild(readMoreBtn);
                } else {
                    messageTextEl.classList.remove('collapsed');
                }
                
                document.body.removeChild(tempDiv);
            } else {
                messageTextEl.innerHTML = '';
            }
            
            if (module.time) {
                messageTimeEl.textContent = module.time;
            } else {
                messageTimeEl.textContent = '';
            }
            
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index === currentModuleIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }


        async function downloadPythonFile() {

            const module = info.modules[currentModuleIndex];
            
            let version = ""

            console.log(module.version, module.version != "0.0.0")
            if (module.version != "0.0.0") {version = module.version}
            console.log(version)

            const fileUrl = `https://raw.githubusercontent.com/Qwertys50/Modules/refs/heads/main/${module.name}${version}.py`;
            const fileName = `${module.name}.py`;
            
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Файл не найден');
                
                const fileContent = await response.text();
                const blob = new Blob([fileContent], { type: 'text/python' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(url), 100);
                
            } catch (error) {
                console.error('Ошибка:', error);
                window.open(fileUrl, '_blank');
            }
        }

        function initSlider() {
            const sliderDots = document.getElementById('sliderDots');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');

            const prevBtn2 = document.querySelector('.prev-btn2');
            const nextBtn2 = document.querySelector('.next-btn2');
            
            sliderDots.innerHTML = '';
            for (let i = 0; i < info.modules.length; i++) {
                const dot = document.createElement('div');
                dot.className = i === 0 ? 'dot active' : 'dot';
                dot.setAttribute('data-index', i);
                dot.addEventListener('click', function() {
                    currentModuleIndex = parseInt(this.getAttribute('data-index'));
                    updateSlider();
                });
                sliderDots.appendChild(dot);
            }
            
            prevBtn.addEventListener('click', function() {
                currentModuleIndex = (currentModuleIndex - 1 + info.modules.length) % info.modules.length;
                updateSlider();
            });
            
            nextBtn.addEventListener('click', function() {
                currentModuleIndex = (currentModuleIndex + 1) % info.modules.length;
                updateSlider();
            });

            prevBtn2.addEventListener('click', function() {
                currentModuleIndex = (currentModuleIndex - 1 + info.modules.length) % info.modules.length;
                updateSlider();
            });
            
            nextBtn2.addEventListener('click', function() {
                currentModuleIndex = (currentModuleIndex + 1) % info.modules.length;
                updateSlider();
            });
            
            updateSlider();
        }

        function toggleSlider() {
            const sliderContainer = document.getElementById('sliderContainer');
            const toggleBtn = document.getElementById('toggleSlider');
            
            if (sliderContainer.style.display === 'none' || !sliderContainer.style.display) {
                sliderContainer.style.display = 'block';
                toggleBtn.textContent = 'Скрыть модули Hikka';
                
                if (document.getElementById('sliderDots').children.length === 0) {
                    initSlider();
                }
            } else {
                sliderContainer.style.display = 'none';
                toggleBtn.textContent = 'Показать модули Hikka';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('toggleSlider').addEventListener('click', toggleSlider);
        });
